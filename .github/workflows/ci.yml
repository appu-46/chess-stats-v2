# Typecheck, lint, test and run Netlify's build on every push to main and
# every pull request, so a broken build is caught here rather than on
# Netlify.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      # Netlify's own build, offline: runs `npm run build` (vite build and
      # tsc) the way Netlify does, then packages the edge functions, which
      # plain `vite build` never touches. A broken edge-functions folder
      # passed every other step here and still failed on Netlify. Vite
      # bakes the Supabase keys in at build time, but builds without them.
      - run: npx -y netlify-cli@27.12.0 build --offline
