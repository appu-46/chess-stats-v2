# Ranks 51-100 of chess.com's leaderboards come from the endpoint its own
# website uses, which can't be called cross-origin; this proxies it from
# our domain (see services/apiLeaderboard.ts). It must come before the SPA
# catch-all below, as the first matching rule wins.
[[redirects]]
  from = "/api/chesscom-leaderboard/*"
  to = "https://www.chess.com/callback/leaderboard/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# `netlify-cli dev` (the local server with functions, on :8888) runs the
# usual dev script and proxies to it. Without this it waits on Vite's
# default port 5173, but the dev script serves on 3000.
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 3000
  port = 8888
