<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Stats: free stats for Chess.com and Lichess</title>
    <meta
      name="description"
      content="Ratings over time, openings, streaks and game history for any Chess.com or Lichess player, plus head-to-head comparisons and the top 100 by country. Free, no sign-up."
    />
    <link rel="icon" href="/knight.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#081410" />

    <!-- How shared links look on WhatsApp, Reddit, X, Discord... %SITE_URL%
         is the deployed address, filled in at build time (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chess Stats" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta
      property="og:title"
      content="Chess Stats: free stats for Chess.com and Lichess"
    />
    <meta
      property="og:description"
      content="Ratings over time, openings, head-to-head comparisons and the top 100 by country. No sign-up, no paywall."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Chess Stats: free stats for Chess.com and Lichess"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
